<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Typst editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>

<style>
:root {
  --paper: #fdfdfc;
  --desk: #e7e9e8;
  --ink: #1f2326;
  --muted: #646b72;
  --line: #dcdfdf;
  --accent: #0d6b75;
  --accent-ink: #ffffff;
  --accent-soft: #dcefef;
  --error: #b8361f;
  --warn: #946200;
  --ok: #2f6b3a;
  --shadow: 0 1px 2px rgba(20, 30, 35, .10), 0 6px 18px rgba(20, 30, 35, .08);
  --ui: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1a1c20; --desk: #121316; --ink: #e4e7ea; --muted: #959ca5; --line: #2c3036;
    --accent: #5cc8d2; --accent-ink: #0b2226; --accent-soft: #173438;
    --error: #ff8a70; --warn: #e8b85c; --ok: #8fd19e;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1a1c20; --desk: #121316; --ink: #e4e7ea; --muted: #959ca5; --line: #2c3036;
  --accent: #5cc8d2; --accent-ink: #0b2226; --accent-soft: #173438;
  --error: #ff8a70; --warn: #e8b85c; --ok: #8fd19e;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  height: 100%; margin: 0; display: flex; flex-direction: column;
  background: var(--paper); color: var(--ink);
  font: 400 14px/1.45 var(--ui);
  overflow: hidden;
}
button, select, input { font: inherit; color: inherit; }

/* ── Top bar ─────────────────────────────────────────── */
.bar {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 12px 8px 16px;
  border-bottom: 1px solid var(--line);
  min-height: 52px; flex-wrap: wrap;
}
.doc { display: flex; align-items: baseline; min-width: 0; flex: 1 1 160px; }
.doc input {
  border: 0; background: transparent; padding: 4px 6px; margin-left: -6px; border-radius: 6px;
  font-weight: 600; font-size: 15px; min-width: 4ch; max-width: 100%; font-family: var(--mono); font-size: 14px;
}
.doc input:hover { background: var(--desk); }
.doc input:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; background: var(--paper); }
.doc .ext { color: var(--muted); font-family: var(--mono); font-size: 12.5px; margin-left: 2px; }
.actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line); background: var(--paper);
  padding: 6px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap;
  font-weight: 500; line-height: 1.3;
}
.btn:hover:not(:disabled) { background: var(--desk); }
.btn:focus-visible, select:focus-visible, .problem:focus-visible, #divider:focus-visible, .chip button:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.quiet { border-color: transparent; color: var(--muted); }
.gap { width: 6px; }
.btn.icon { padding: 5px 7px; display: inline-flex; align-items: center; color: var(--muted); }
.btn.icon:hover { color: var(--ink); }

/* Settings dialog */
dialog {
  border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(440px, calc(100vw - 32px));
  background: var(--paper); color: var(--ink); box-shadow: var(--shadow);
}
dialog::backdrop { background: rgba(10, 14, 18, .35); }
dialog form { padding: 20px 22px 18px; }
dialog h2 { margin: 0 0 14px; font-size: 16px; font-weight: 600; }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
.opt input { margin: 3px 0 0; width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
.opt strong { display: block; font-weight: 500; }
.opt small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.45; margin-top: 2px; }
.dialog-actions { display: flex; justify-content: flex-end; padding-top: 14px; border-top: 1px solid var(--line); }

#pane-toggle { display: none; border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
#pane-toggle button { border: 0; background: transparent; padding: 4px 12px; border-radius: 6px; cursor: pointer; color: var(--muted); }
#pane-toggle button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 500; }

#attached { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 6px 16px; border-top: 1px solid var(--line); font-size: 12.5px; }
#attached[hidden] { display: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); background: var(--desk); border-radius: 999px; padding: 2px 4px 2px 10px; }
.chip button { border: 0; background: transparent; cursor: pointer; color: var(--muted); width: 20px; height: 20px; border-radius: 50%; line-height: 1; }
.chip button:hover { background: var(--line); color: var(--ink); }

/* ── Workspace ───────────────────────────────────────── */
#workspace {
  --split: 50%;
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: minmax(0, var(--split)) 6px minmax(0, 1fr);
}
.pane { min-width: 0; min-height: 0; position: relative; }
.src { background: var(--paper); }
#editor { position: absolute; inset: 0; }
#divider { cursor: col-resize; background: var(--line); position: relative; touch-action: none; }
#divider::after { content: ""; position: absolute; inset: 0 -4px; }
#divider:hover, body.resizing #divider { background: var(--accent); }
body.resizing { cursor: col-resize; user-select: none; }
body.resizing iframe, body.resizing #editor { pointer-events: none; }

.pre { background: var(--desk); display: flex; flex-direction: column; }
.pre-bar {
  display: flex; align-items: center; gap: 12px; padding: 6px 12px 6px 16px;
  font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--line);
}
#status { margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#status::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 8px; vertical-align: 1px; }
#status[data-tone="ok"]::before { background: var(--ok); }
#status[data-tone="warn"]::before { background: var(--warn); }
#status[data-tone="error"] { color: var(--error); }
#status[data-tone="error"]::before { background: var(--error); }
#status[data-tone="busy"]::before { background: var(--accent); animation: pulse 1s ease-in-out infinite alternate; }
@keyframes pulse { from { opacity: .3; } to { opacity: 1; } }
.zoom-btn {
  border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 1px 8px;
  font: 500 12.5px var(--ui); color: var(--muted); cursor: pointer; min-width: 6ch; font-variant-numeric: tabular-nums;
}
.zoom-btn:hover { color: var(--ink); }
#preview-scroll {
  flex: 1; min-height: 0; position: relative; overflow: hidden;
  touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none;
}
#preview-scroll:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
#preview-scroll.panning { cursor: grabbing; }
#pages {
  position: absolute; left: 0; top: 0; transform-origin: 0 0;
  display: flex; flex-direction: column; gap: 20px; will-change: transform;
}
#pages canvas { background: #fff; box-shadow: var(--shadow); display: block; max-width: none; }
#preview.stale #pages { opacity: .55; transition: opacity .2s; }
.empty { color: var(--muted); max-width: 46ch; margin: 18vh auto 0; padding: 0 16px; text-align: center; }
#preview-msg { position: absolute; inset: 0; margin: 0; padding-top: 18vh; max-width: none; }
#preview-msg[hidden] { display: none; }

#problems {
  max-height: 34%; overflow: auto; border-top: 1px solid var(--line); background: var(--paper);
  display: flex; flex-direction: column;
}
#problems[hidden] { display: none; }
.problem {
  display: flex; gap: 12px; align-items: baseline; text-align: left;
  border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 8px 16px; cursor: pointer;
  font-size: 13px;
}
.problem:hover:not(:disabled) { background: var(--desk); }
.problem:disabled { cursor: default; }
.problem .loc { font-family: var(--mono); font-size: 12px; color: var(--muted); flex: none; min-width: 5ch; }
.problem[data-sev="error"] { color: var(--error); }
.problem[data-sev="warning"] { color: var(--warn); }

/* Drop target */
.dropzone {
  position: fixed; inset: 12px; border: 2px dashed var(--accent); border-radius: 14px;
  background: color-mix(in srgb, var(--paper) 86%, transparent);
  display: none; align-items: center; justify-content: center; z-index: 50;
  font-size: 16px; font-weight: 500; pointer-events: none;
}
body.dragging .dropzone { display: flex; }

/* Narrow screens: one pane at a time */
@media (max-width: 760px) {
  #pane-toggle { display: inline-flex; }
  .bar { gap: 8px; }
  .actions { width: 100%; }
  .actions .btn { padding: 6px 10px; }
  #workspace { grid-template-columns: minmax(0, 1fr); }
  #divider { display: none; }
  #workspace[data-pane="source"] .pre, #workspace[data-pane="preview"] .src { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  #status[data-tone="busy"]::before { animation: none; }
  #preview.stale #pages { transition: none; }
}
/* Keep Monaco's widgets in our font where it shows UI text */
.monaco-editor .suggest-widget, .monaco-hover, .parameter-hints-widget { font-family: var(--ui); }
</style>
</head>
<body>
<header class="bar">
  <div class="doc">
    <input id="doc-name" value="document" aria-label="Document name (used for downloads)" spellcheck="false" autocomplete="off">
    <span class="ext">.typ</span>
  </div>
  <div id="pane-toggle" role="group" aria-label="Show pane">
    <button type="button" data-pane="source" aria-pressed="true">Source</button>
    <button type="button" data-pane="preview" aria-pressed="false">Preview</button>
  </div>
  <div class="actions">
    <button class="btn" id="open" type="button" title="Open a .typ file, or attach images, data and fonts it uses">Open…</button>
    <span class="gap"></span>
    <button class="btn" id="dl-src" type="button" title="Download the Typst source (Ctrl/⌘ + S)">Download source</button>
    <button class="btn primary" id="dl-pdf" type="button" disabled>Download PDF</button>
    <button class="btn icon" id="open-settings" type="button" aria-label="Settings" title="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>
<main id="workspace" data-pane="source">
  <section class="pane src" aria-label="Typst source"><div id="editor"></div></section>
  <div id="divider" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize panes"></div>
  <section class="pane pre" id="preview" aria-label="PDF preview">
    <div class="pre-bar">
      <p id="status" role="status" aria-live="polite" data-tone="busy">Loading the editor…</p>
      <span id="page-count"></span>
      <button type="button" class="zoom-btn" id="zoom-reset" title="Fit to width (0 or double-click)">100%</button>
    </div>
    <div id="preview-scroll" tabindex="0" aria-label="Preview canvas. Pinch or Ctrl+scroll to zoom, drag or scroll to pan, 0 to fit." title="Pinch or Ctrl+scroll to zoom · drag to pan · double-click to fit"><div id="pages"></div><p id="preview-msg" class="empty">The preview appears here once the Typst compiler has started.</p></div>
    <div id="problems" hidden aria-label="Problems"></div>
  </section>
</main>
<div id="attached" hidden aria-label="Attached files"></div>
<dialog id="settings" aria-labelledby="settings-title">
  <form method="dialog">
    <h2 id="settings-title">Editor settings</h2>
    <label class="opt"><input type="checkbox" id="opt-suggest"><span><strong>Suggestions while typing</strong><small>Completions for functions, parameters, symbols and labels as you type. Ctrl+Space still opens them when this is off.</small></span></label>
    <label class="opt"><input type="checkbox" id="opt-params"><span><strong>Argument hints</strong><small>Shows a function’s parameters while you type inside its brackets.</small></span></label>
    <label class="opt"><input type="checkbox" id="opt-hover"><span><strong>Hover documentation</strong><small>Shows what a function does when you hover over it.</small></span></label>
    <div class="dialog-actions"><button class="btn primary" value="done">Done</button></div>
  </form>
</dialog>
<div class="dropzone">Drop a .typ file, or images, data and fonts to attach</div>
<input type="file" id="file-input" multiple hidden accept=".typ,.txt,.png,.jpg,.jpeg,.gif,.webp,.svg,.pdf,.csv,.json,.yaml,.yml,.toml,.xml,.bib,.ttf,.otf,.ttc,.otc">
